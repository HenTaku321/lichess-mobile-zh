name: Build unsigned iOS IPA

# Produces an UNSIGNED .ipa for personal install (TrollStore / self-signing).
# No Apple Developer account, no provisioning profile, no exportArchive:
# this mirrors the repo's own "test_build" fastlane lane, which builds with
# --no-codesign and packs the .app into an IPA by hand.
#
# Started by hand (see the trigger below). Only the newest run is kept: the
# workflow-wide concurrency group serializes all runs and cancels an in-flight
# build when a newer one arrives, so at most one macOS runner is ever active.
# The IPA is published to the rolling prerelease GitHub Release "latest", which is
# overwritten each time — Actions artifact storage is not used.
#
# Point the app at a translation proxy by setting repository *variables*
# (Settings -> Secrets and variables -> Actions -> Variables), no code edit:
#   LICHESS_HOST      e.g. lichess-zh.example.com        (default: lichess.org)
#   LICHESS_WS_HOST   e.g. lichess-zh.example.com        (default: socket.lichess.org)
# and repository *secret*:
#   WS_SECRET         socket secret                          (default: somethingElseInProd)

on:
  # Manual only, deliberately. A push trigger here means every intermediate
  # commit made while iterating on Dart code fires a full iOS build, and the
  # concurrency group below then cancels the build that was already running —
  # so a typo fix can cost two macOS builds and produce no IPA. The fast
  # feedback loop is `.github/workflows/test.yml`; run this one when there is
  # something worth installing:
  #
  #   gh workflow run build-ios-unsigned.yml --ref zh-local
  workflow_dispatch:

# Group is intentionally NOT per-ref: all runs share it so a new push cancels a
# build already running on the runner, not just one that is merely queued.
concurrency:
  group: build-ios-unsigned
  cancel-in-progress: true

permissions:
  contents: write # required to create/update the rolling release

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-26
    # Every run starts on a fresh runner, so the whole Swift Package Manager
    # dependency graph (Firebase, grpc, abseil, ...) is compiled from source
    # each time. Measured wall time on macos-26 already exceeded 87 minutes;
    # leave generous headroom so a genuinely slow cold build can finish.
    # One run was cancelled at the 180 minute cap while still inside
    # "Build (release, no codesign)". At cancellation `upload-symbols` was alive,
    # and that upload is the *last* build phase of the Runner target, so the
    # compile had finished and the overrun was the upload retrying against
    # Google. The Build step now skips it — see SKIP_CRASHLYTICS_UPLOAD below.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Regenerates *.freezed.dart / *.g.dart.
      - name: Code generation
        run: dart run build_runner build

      # `gen-arb.mjs` imports `colors`, `xml2js` and `js-yaml`, and upstream never
      # runs it in CI, so nothing else installs them.
      - name: Install translation script dependencies
        run: npm ci --no-audit --no-fund
        working-directory: scripts

      # `translation/dest/**/<locale>.xml` is the source of truth for the ARBs:
      # this fork edits the zh-CN XML files, so gen-arb must run BEFORE the build
      # or the edits never reach the app. Runs `gen-arb.mjs` (XML -> app_*.arb),
      # then `flutter gen-l10n` (ARB -> lib/l10n/l10n_*.dart), then the widget
      # string catalog. Flutter is already installed by the step above.
      - name: Generate translations
        run: ./scripts/gen-translations.sh

      # `flutter pub get` resets the generated SwiftPM manifest's deployment target to
      # Flutter's default (iOS 13), which makes the archive fail on the Firebase plugins.
      # The fastlane lane notes this; the release build below does not need pub get again.
      # `xcodebuild` prints nothing for the bulk of the compile, so a silent log
      # cannot be told apart from a hung one. A background ticker keeps the log
      # timestamped and counts compiled object files, so the tail of a failed run
      # says whether the build was still progressing when it was cut off.
      #
      # The Xcode "Crashlytics Upload Symbols" phase
      # (ios/Runner.xcodeproj/project.pbxproj) is skipped for this build: uploading
      # dSYMs to Google is meaningless for an unsigned personal build, and that
      # upload is the phase that overran a previous run. Both the environment
      # variable and a marker file next to the project are set, because a
      # run-script phase gets the marker file regardless of how Flutter passes the
      # environment down to xcodebuild.
      - name: Build (release, no codesign)
        env:
          SKIP_CRASHLYTICS_UPLOAD: '1'
        run: |
          set -uo pipefail
          touch ios/.skip-crashlytics-upload
          flutter build ios --release --no-codesign \
            --dart-define=LICHESS_HOST=${{ vars.LICHESS_HOST || 'lichess.org' }} \
            --dart-define=LICHESS_WS_HOST=${{ vars.LICHESS_WS_HOST || 'socket.lichess.org' }} \
            --dart-define=LICHESS_WS_SECRET=${{ secrets.WS_SECRET || 'somethingElseInProd' }} &
          build_pid=$!
          rc=0
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 120
            kill -0 "$build_pid" 2>/dev/null || break
            objs=$(find "$HOME/Library/Developer/Xcode/DerivedData" build/ios -name '*.o' 2>/dev/null | wc -l | tr -d ' ')
            echo "[$(date -u +%H:%M:%S)] still building (pid $build_pid, $((SECONDS/60))m elapsed, $objs objects compiled)..."
          done
          wait "$build_pid" || rc=$?
          exit "$rc"

      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -qry lichess-zh.ipa Payload)
          rm -rf out/Payload
          ls -lh out/lichess-zh.ipa

      # Publish to the rolling "latest" release so exactly one IPA is kept.
      - name: Publish to rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/lichess-zh.ipa \
            --title "Latest zh build" \
            --notes "Unsigned IPA from ${GITHUB_SHA::7}, triggered by ${GITHUB_EVENT_NAME}. Install via TrollStore." \
            --prerelease \
            --target "${GITHUB_SHA}"