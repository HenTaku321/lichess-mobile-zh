name: Build Linux desktop bundle

# Produces a self-contained Linux desktop bundle (x86_64) from the same sources
# as the unsigned IPA, for running the zh build on a Linux machine. Upstream
# added the Linux target in cd9b8d1e6 ("Add Linux platform"), and the code
# guards what does not exist there: Firebase is skipped in main.dart, the
# database goes through sqflite_common_ffi, the sound service shells out. So it
# builds and runs, and the engines are the app's own here too: the three
# Stockfish flavours come from our fork of dart-multistockfish (see the
# dependency_overrides in pubspec.yaml), which adds a Linux build to each, so all
# eight variants are playable without a stockfish from the AUR. Maia still is
# not: LC0 has no Linux build in the fork. The gate below the build fails the job
# if a flavour's shared object is missing from the bundle.
#
# The mobile-only features stay off:
#
#   - no crash reporting or push (Firebase is not initialised)
#   - no notifications, no home screen widgets
#   - the browser sign-in does not work: flutter_appauth ships for Android, iOS
#     and macOS only, and auth_repository.dart calls it unconditionally. Signing
#     in goes through "Sign in with email" instead, which is plain HTTP
#     (POST /auth/mobile-code/bearer) and never touches appauth.
#
# Started by hand, for the same reason as the iOS build: a push trigger means a
# build per intermediate commit. See build-ios-unsigned.yml.
#
# The runner is x86_64 and so is the tarball. Flutter builds Linux desktop for
# the host architecture only; there is no cross-compile flag for aarch64.
#
# Point the app at a translation proxy by setting repository *variables*
# (Settings -> Secrets and variables -> Actions -> Variables), no code edit:
#   LICHESS_HOST      e.g. lichess-zh.example.com        (default: lichess.org)
#   LICHESS_WS_HOST   e.g. lichess-zh.example.com        (default: socket.lichess.org)
#
# The OAuth signed-client secret is NOT passed in from anywhere on GitHub, for
# the same reason as the iOS build: anything the runner can see lives on GitHub
# and ends up inside the published tarball either way, so the build bakes in the
# placeholder below and the real value is swapped in locally, after download, by
# patch-linux-secret.py (kept outside this repository, next to
# patch-ipa-secret.py). The placeholder is exactly as long as the value that
# replaces it on purpose: the Dart AOT snapshot stores the character count as a
# Smi immediately before the characters, and an object cannot grow in place, so
# equal length keeps the swap a pure byte replace.
#
# Published to its own rolling release (linux-latest) rather than the iOS one:
# both workflows delete and recreate their release to keep exactly one asset, so
# sharing the "latest" tag would mean each build erasing the other's download.

on:
  workflow_dispatch:

# Not per-ref, like the iOS build: a newer dispatch cancels the one running,
# so at most one Linux runner is active.
concurrency:
  group: build-linux-desktop
  cancel-in-progress: true

permissions:
  contents: write # required to create/update the rolling release

jobs:
  linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    # A Linux build is short next to the iOS one (no SwiftPM graph, no Xcode);
    # the cap is here so a wedged runner cannot hold the concurrency group.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter --version

      # Flutter's own Linux desktop requirements, plus what the plugins this app
      # pulls in need to configure: flutter_secure_storage_linux asks pkg-config
      # for secret-1 and jsoncpp, and sqflite_common_ffi wants libsqlite3 (test.yml
      # installs the same pair).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libsqlite3-0 libsqlite3-dev

      - name: Enable the Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # Regenerates *.freezed.dart / *.g.dart.
      - name: Code generation
        run: dart run build_runner build

      # `gen-arb.mjs` imports `colors`, `xml2js` and `js-yaml`, and upstream never
      # runs it in CI, so nothing else installs them.
      - name: Install translation script dependencies
        run: npm ci --no-audit --no-fund
        working-directory: scripts

      # `translation/dest/**/<locale>.xml` is the source of truth for the ARBs:
      # this fork edits the zh-CN XML files, so gen-arb must run BEFORE the build
      # or the edits never reach the app. Same chain as the iOS build.
      - name: Generate translations
        run: ./scripts/gen-translations.sh

      # The Pikafish network is an asset the repository does not carry (see .gitignore), so a
      # build without this step fails in `flutter build` on a missing asset rather than shipping a
      # desktop edition whose xiangqi opponent evaluates noise. Checks the sha256 and fails the job
      # on a mismatch; a no-op when the file is already there.
      - name: Fetch the Pikafish network
        run: ./scripts/fetch-pikafish-nnue.sh

      - name: Build (release)
        run: |
          # Both placeholders are swapped byte for byte by patch-linux-secret.py
          # (32 bytes and 37), so neither may change length: Dart keeps the string's
          # character count as a Smi right before the characters and an AOT snapshot
          # object cannot grow in place. Same contract as the iOS build.
          flutter build linux --release \
            --dart-define=LICHESS_HOST=${{ vars.LICHESS_HOST || 'lichess.org' }} \
            --dart-define=LICHESS_WS_HOST=${{ vars.LICHESS_WS_HOST || 'socket.lichess.org' }} \
            --dart-define=LICHESS_WS_SECRET=PLACEHOLDER_WS_SECRET_DO_NOT_USE \
            --dart-define=ZH_PROXY_TOKEN=PLACEHOLDER_ZH_PROXY_TOKEN_DO_NOT_USE

      # The four flavours are FFI plugins, so their shared objects are installed
      # into bundle/lib beside the executable and loaded from there at runtime
      # (see the Linux branch of the umbrella package's stockfish.dart). If a
      # flavour silently stopped being built, the app would look fine until
      # someone tried to play a variant on it, and the tarball would be published
      # before anyone noticed. Hence the check here rather than in a test: this is
      # the only place the real bundle exists.
      #
      # The network is checked for the same reason and by its size: Pikafish
      # without it does not fail, it plays at random, which is the kind of bug
      # that gets reported as "the computer is bad at chess".
      - name: Check the bundled engines are there
        run: |
          set -euo pipefail
          for flavour in chess light pikafish variant; do
            lib=build/linux/x64/release/bundle/lib/libmultistockfish_${flavour}.so
            if [ ! -f "$lib" ]; then
              echo "::error::missing $lib — the $flavour engine did not get built or bundled"
              exit 1
            fi
            ls -l "$lib"
          done

          nnue=build/linux/x64/release/bundle/data/flutter_assets/assets/pikafish/pikafish.nnue
          size=$(stat -c%s "$nnue" 2>/dev/null || echo 0)
          # The expected size comes from the manifest, not a literal here: a second copy of the
          # number is a second thing to forget when the network moves.
          expected=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["size"])' \
            scripts/pikafish-net.json)
          if [ "$size" != "$expected" ]; then
            echo "::error::$nnue is $size bytes, expected $expected — the network is missing or truncated"
            exit 1
          fi
          ls -l "$nnue"

      # The bundle is the whole app: the lichess_mobile binary, lib/ (libapp.so is
      # the Dart AOT snapshot the secret is patched inside) and data/ with the
      # assets, the zh practice overlay included. Renaming the top directory from
      # 'bundle' to lichess-zh so it unpacks to something that says what it is.
      - name: Pack bundle
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out/lichess-zh
          cp -R build/linux/x64/release/bundle/. out/lichess-zh/
          (cd out && tar -czf lichess-zh-linux-x86_64.tar.gz lichess-zh)
          rm -rf out/lichess-zh
          ls -lh out/lichess-zh-linux-x86_64.tar.gz
          sha256sum out/lichess-zh-linux-x86_64.tar.gz

      # Publish to the rolling "linux-latest" release so exactly one tarball is kept.
      - name: Publish to rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release *and* its tag both have to be gone before create will take
          # the tag again. `--cleanup-tag` has been observed to leave the tag
          # behind, and the create then dies with "a release with the same tag
          # name already exists: linux-latest" -- which is a failure that looks
          # like the build and is not. Deleting the ref as well is idempotent:
          # it is a no-op when the tag is already gone, which is why both lines
          # are allowed to fail.
          gh release delete linux-latest --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/linux-latest" 2>/dev/null || true
          gh release create linux-latest out/lichess-zh-linux-x86_64.tar.gz \
            --title "Latest zh Linux desktop build" \
            --notes "x86_64 desktop bundle from ${GITHUB_SHA::7}, triggered by ${GITHUB_EVENT_NAME}. Unpack and run lichess-zh/lichess_mobile." \
            --prerelease \
            --target "${GITHUB_SHA}"
