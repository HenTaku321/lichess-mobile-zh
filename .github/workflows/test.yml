name: Tests

on:
  push:
    paths:
      - 'lib/**'
      - '!lib/l10n/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - 'translation/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
    branches:
      - main
      # This fork's working branch. The zh-local edits are authored on a machine
      # with no Flutter installed, so a 12-minute iOS build is the only other
      # feedback loop; this job is where a typo is supposed to be caught.
      - zh-local
      - fix/xiangqi-interaction-parity
      - fix/xiangqi-desktop-parity
  pull_request:
    paths:
      - 'lib/**'
      - '!lib/l10n/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - 'translation/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
    branches:
      - main

# Cancel superseded PR runs so only the latest pushed commit is actually tested.
# Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Declare default permissions as read only.
permissions: read-all

jobs:
  unit-test:
    name: Unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung widget test otherwise occupies a runner until the 6 hour default.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install requirements for sqflite_common_ffi package
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      # Model codegen stays on Actions too; only generated schema code is exported, never binaries.
      - name: Export generated review model
        if: github.ref == 'refs/heads/fix/xiangqi-interaction-parity'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiangqi-review-model-${{ github.sha }}
          path: lib/src/model/xiangqi/review/xiangqi_review.freezed.dart
          retention-days: 3

      # gen-arb.mjs imports `colors`, `xml2js` and `js-yaml`; upstream never runs
      # these scripts in CI, so nothing else installs them. `npm ci` (not install)
      # so a lockfile that drifts from package.json fails here rather than
      # silently resolving a different version than the one used locally.
      - name: Install translation script dependencies
        run: npm ci --no-audit --no-fund
        working-directory: scripts

      # New zh-CN strings are added to translation/source/mobile.xml, and the
      # committed lib/l10n/app_*.arb are not regenerated by hand. Without this,
      # analyze would report every new `l10n.foo` getter as undefined.
      - name: Generate translations
        run: ./scripts/gen-translations.sh

      # The Pikafish network is an asset the repository does not carry (see .gitignore), and both
      # of the checks below read the pubspec's asset list: analyze warns when a declared asset is
      # not on disk (`asset_does_not_exist`, which fatal-infos turns into a failure), and
      # `flutter test` builds the asset bundle before it runs anything. So it is fetched here,
      # before either of them, and not only before the tests.
      - name: Fetch the Pikafish network
        run: ./scripts/fetch-pikafish-nnue.sh

      # The engine refuses a network whose architecture hash is not the one its own headers compute,
      # and it refuses it by exiting from inside the first search, which in a library beside a Dart
      # VM deadlocks instead of reporting anything. No test can catch that — every engine test runs
      # on a fake transport and every nnuePath in them is a literal that does not exist — so the
      # pairing is checked here, against the vendored headers, before anything is built. Needs the
      # `flutter pub get` above: it finds the snapshot through .dart_tool/package_config.json.
      - name: Check the network matches the vendored engine
        run: dart run scripts/pikafish_net_hash.dart --check

      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed $(find lib/src -name "*.dart" -not \( -name "*.*freezed.dart" -o -name "*.*g.dart" -o -name "*lichess_icons.dart" \) )
          dart format --output=none --set-exit-if-changed $(find test -name "*.dart" -not \( -name "*.*freezed.dart" -o -name "*.*g.dart" \) )
        # run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        id: analyze
        run: flutter analyze

      # - name: Run riverpod lint
      #   run: dart run custom_lint

      - name: Run xiangqi interaction regressions
        run: >-
          flutter test --no-pub --reporter expanded
          test/view/xiangqi/xiangqi_history_parity_test.dart
          test/view/xiangqi/xiangqi_review_contract_test.dart
          test/view/xiangqi/xiangqi_online_game_screen_test.dart
          test/view/xiangqi/xiangqi_over_the_board_screen_test.dart
          test/view/xiangqi/xiangqi_review_screen_test.dart
          test/view/xiangqi/xiangqi_analysis_screen_test.dart
          test/model/xiangqi/review/xiangqi_review_test.dart
          test/model/xiangqi/xiangqi_analysis_controller_test.dart
          test/network/xiangqi_hardening_test.dart
          test/widgets/history_navigation_button_test.dart
          test/widgets/xiangqi_board_test.dart

      - name: Run xiangqi desktop regressions
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test --no-pub --reporter expanded
          test/view/xiangqi/xiangqi_desktop_regression_test.dart
          test/view/xiangqi/xiangqi_desktop_pages_test.dart
          test/view/xiangqi/xiangqi_desktop_socket_test.dart
          test/init_test.dart
          test/widgets/xiangqi_refresh_test.dart
          test/view/message/xiangqi_conversation_screen_test.dart

      - name: Run xiangqi lifecycle regressions
        id: lifecycle
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test --no-pub --reporter expanded
          test/model/xiangqi/xiangqi_practice_lifecycle_test.dart
          test/model/xiangqi/xiangqi_game_storage_order_test.dart
          test/model/xiangqi/puzzle/xiangqi_puzzle_controller_test.dart
          test/view/xiangqi/xiangqi_practice_screen_contract_test.dart
          test/widgets/practice_feedback_card_test.dart
          test/view/xiangqi/xiangqi_training_feedback_parity_test.dart
          test/view/xiangqi/xiangqi_online_action_parity_test.dart
          test/model/xiangqi/xiangqi_analysis_branch_parity_test.dart
          test/widgets/analysis_layout_parity_test.dart
          test/view/xiangqi/xiangqi_analysis_branch_screen_test.dart
          test/view/xiangqi/xiangqi_full_history_handoff_test.dart
          test/view/xiangqi/xiangqi_board_editor_screen_test.dart
          test/view/xiangqi/xiangqi_computer_menu_parity_test.dart

      - name: Fetch fixed desktop screenshot fonts
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.lifecycle.outcome == 'success' }}
        run: bash scripts/fetch-desktop-test-fonts.sh out/visual-fonts

      - name: Run desktop visual matrix
        id: desktop_visual
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.lifecycle.outcome == 'success' }}
        env:
          XIANGQI_DESKTOP_VISUALS: '1'
          XIANGQI_VISUAL_FONT_DIR: out/visual-fonts
          XIANGQI_SCREENSHOT_DIR: out/desktop-screenshots
        run: flutter test --no-pub --reporter expanded test/view/xiangqi/xiangqi_desktop_visual_test.dart

      - name: Export desktop screenshots and geometry
        if: ${{ !cancelled() && steps.desktop_visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiangqi-desktop-visuals-${{ github.sha }}
          path: out/desktop-screenshots
          retention-days: 7
          if-no-files-found: error

      - name: Run unit tests
        run: flutter test

